[project]
name = "storymaker"
version = "0.1.0"
description = "Turn a Claude-written story script into a voiced, sound-designed Lunii pack"
authors = [
    { name = "Davide Morelli", email = "morelli.davide@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
storymaker = "storymaker.cli:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
